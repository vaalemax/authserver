<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Roles — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms}">← Realms</a></p>
<h1>Realm roles <span th:text="${realmName}"></span></h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Name</th><th>Level</th><th>Permissions</th></tr>
    <tr th:each="r : ${roles}">
        <td th:text="${r.name}"></td>
        <td th:text="${r.level}"></td>
        <td th:text="${#strings.listJoin(r.permissions.![name], ', ')}"></td>
    </tr>
</table>

<h2>New role</h2>
<form th:action="@{/console/realms/{name}/roles(name=${realmName})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Nome <input type="text" name="name" required></label><br>
    <label>Level <input type="number" name="level"></label><br>
    <p>Permissions:</p>
    <div th:each="p : ${allPermissions}">
        <label>
            <input type="checkbox" name="permissionIds" th:value="${p.id}">
            <span th:text="${p.name + ' (' + p.subject + '/' + p.action + ')'}"></span>
        </label><br>
    </div>
    <button type="submit">Create</button>
</form>
</body>
</html>
