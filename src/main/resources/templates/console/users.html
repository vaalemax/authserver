<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Utenti — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms}">← Realms</a></p>
<h1>Utenti del realm <span th:text="${realmName}"></span></h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Username</th><th>Abilitato</th><th>Ruoli (auth)</th></tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.username}"></td>
        <td th:text="${user.enabled}"></td>
        <td th:text="${user.roles}"></td>
        <td><a th:href="@{/console/realms/{r}/users/{u}/roles(r=${realmName},u=${user.username})}">Ruoli ABAC</a></td>
    </tr>
</table>

<h2>Nuovo utente</h2>
<form th:action="@{/console/realms/{name}/users(name=${realmName})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Username <input type="text" name="username" required></label><br>
    <label>Password <input type="password" name="password" required></label><br>
    <label>Ruoli auth (virgola, es. ADMIN,USER) <input type="text" name="roles"></label><br>
    <button type="submit">Crea</button>
</form>
</body>
</html>
