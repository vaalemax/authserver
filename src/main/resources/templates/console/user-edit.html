<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit User — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms/{name}/users/{user}/edit(name=${realmName},user=${username})}">← Users</a></p>
<h1>Edit user</h1>

<form th:action="@{/console/realms/{name}/users/{user}/update(name=${realmName},user=${username})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Username <input type="text" name="username" th:value="${appUser.username}"></label><br>
    <label>Password <input type="text" name="password"></label><br>

    <button type="submit">Save</button>
</form>
</body>
</html>
