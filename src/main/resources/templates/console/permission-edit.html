<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Permission — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms/{name}/permissions(name=${realmName})}">← Permissions</a></p>
<h1>Edit permission</h1>

<form th:action="@{/console/realms/{name}/permissions/{id}/update(name=${realmName},id=${permission.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Subject <input type="text" th:value="${permission.subject}" disabled></label><br>
    <label>Action <input type="text" th:value="${permission.action}" disabled></label><br>
    <p style="color:#666; font-size:.85em;">Subject and action are immutable. Delete and recreate to change them.</p>

    <label>Name <input type="text" name="name" th:value="${permission.name}" required></label><br>
    <label>Subject label <input type="text" name="subjectLabel" th:value="${permission.subjectLabel}"></label><br>
    <label>Action label <input type="text" name="actionLabel" th:value="${permission.actionLabel}"></label><br>
    <label>Condition template <input type="text" name="conditionTemplate" size="80" th:value="${permission.conditionTemplate}"></label><br>
    <label>Condition label <input type="text" name="conditionLabel" th:value="${permission.conditionLabel}"></label><br>

    <button type="submit">Save</button>
</form>
</body>
</html>
