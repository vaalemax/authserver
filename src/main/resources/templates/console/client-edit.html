<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Client — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms/{name}/clients(name=${realmName})}">← Clients</a></p>
<h1>Edit client <span th:text="${client.clientId}"></span></h1>

<form th:action="@{/console/realms/{name}/clients/{id}/update(name=${realmName},id=${client.clientId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Client ID <input type="text" th:value="${client.clientId}" disabled></label><br>
    <p style="color:#666; font-size:.85em;">Client ID is immutable — delete and recreate to change it.</p>

    <label>Redirect URIs (comma-separated) <input type="text" name="redirectUris" size="80" th:value="${redirectUrisJoined}" required></label><br>
    <label>Scopes (comma-separated) <input type="text" name="scopes" th:value="${scopesJoined}" required></label><br>
    <label><input type="checkbox" name="requireProofKey" th:checked="${requireProofKey}"> Require PKCE</label><br>
    <label><input type="checkbox" name="requireAuthorizationConsent" th:checked="${requireAuthorizationConsent}"> Require consent</label><br>
    <label>New client secret <input type="password" name="newClientSecret" placeholder="Leave blank to keep unchanged"></label><br>

    <button type="submit">Save</button>
</form>
</body>
</html>
