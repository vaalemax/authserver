<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Assigned Role — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms/{name}/users/{user}/roles(name=${realmName},user=${username})}">← Assigned roles</a></p>
<h1>Edit assigned role</h1>

<form th:action="@{/console/realms/{name}/users/{user}/roles/{id}/update(name=${realmName},user=${username},id=${userRoleId})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <label>Role <input type="text" th:value="${userRole.role.name}" disabled></label><br>
  <p style="color:#666; font-size:.85em;">Role is immutable. Delete and recreate the role to change it.</p>

  <label>Valid from <input type="datetime-local" name="validFrom" th:value="${userRole.validFrom}" required></label><br>
  <label>Valid to <input type="datetime-local" name="validTo" th:value="${userRole.validTo}"></label><br>
  <label>Attributes <input type="text" name="attributes" th:value="${userRole.attributes}" required></label><br>

  <button type="submit">Save</button>
</form>
</body>
</html>
