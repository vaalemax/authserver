<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Realm — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms}">← Realms</a></p>
<h1>Edit realm <span th:text="${realm.name}"></span></h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<p>Status: <strong th:text="${realm.enabled} ? 'Enabled' : 'Disabled'"></strong></p>

<form th:action="@{/console/realms/{name}/update(name=${realm.name})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Name <input type="text" th:value="${realm.name}" disabled></label><br>
    <p style="color:#666; font-size:.85em;">Realm name is immutable, it's part of every issuer URL and token ever signed under it.</p>

    <label>Display name <input type="text" name="displayName" th:value="${realm.displayName}"></label><br>
    <button type="submit">Save</button>
</form>

<form th:action="@{/console/realms/{name}/toggle-enabled(name=${realm.name})}" method="post" style="margin-top:20px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit"
            th:text="${realm.enabled} ? 'Disable realm' : 'Enable realm'"
            th:onclick="${realm.enabled} ? 'return confirm(&quot;Disable this realm? All its protocol endpoints will stop working immediately.&quot;)' : null">
    </button>
</form>
</body>
</html>
