<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Permissions — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms}">← Realms</a></p>
<h1>Realm permissions <span th:text="${realmName}"></span></h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Name</th><th>Subject</th><th>Action</th><th>Condition template</th><th></th></tr>
    <tr th:each="p : ${permissions}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.subject}"></td>
        <td th:text="${p.action}"></td>
        <td th:text="${p.conditionTemplate}"></td>
        <td th:text="${p.enabled}"></td>
        <td>
            <a th:href="@{/console/realms/{name}/permissions/{id}/edit(name=${realmName},id=${p.id})}">Edit</a>
            <form th:action="@{/console/realms/{name}/permissions/{id}/delete(name=${realmName},id=${p.id})}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" onclick="return confirm('Delete this permission?')">Delete</button>
            </form>
        </td>
    </tr>
</table>

<h2>New permission</h2>
<form th:action="@{/console/realms/{name}/permissions(name=${realmName})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Nome <input type="text" name="name" required></label><br>
    <label>Subject <input type="text" name="subject" required placeholder="es. water-supply-zone"></label><br>
    <label>Subject label <input type="text" name="subjectLabel"></label><br>
    <label>Action <input type="text" name="action" required placeholder="es. read"></label><br>
    <label>Action label <input type="text" name="actionLabel"></label><br>
    <label>Condition template <input type="text" name="conditionTemplate" size="80"
                                     placeholder="{istatRegione:{{istatRegione}}}"></label><br>
    <label>Condition label <input type="text" name="conditionLabel"></label><br>
    <button type="submit">Crea</button>
</form>
</body>
</html>
