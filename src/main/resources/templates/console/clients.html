<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Client — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms}">← Realms</a></p>
<h1>Client del realm <span th:text="${realmName}"></span></h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Client ID</th><th>Redirect URI</th><th>Scope</th></tr>
    <tr th:each="client : ${clients}">
        <td th:text="${client.clientId}"></td>
        <td th:text="${client.redirectUris}"></td>
        <td th:text="${client.scopes}"></td>
    </tr>
</table>

<h2>New client</h2>
<form th:action="@{/console/realms/{name}/clients(name=${realmName})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Client ID <input type="text" name="clientId" required></label><br>
    <label>Client Secret <input type="text" name="clientSecret" required></label><br>
    <label>Redirect URI <input type="text" name="redirectUri" required></label><br>
    <label>Scope (comma) <input type="text" name="scopes" value="openid,profile"></label><br>
    <button type="submit">Create</button>
</form>
</body>
</html>
