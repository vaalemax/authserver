<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Assigned roles — Admin Console</title></head>
<body>
<p><a th:href="@{/console/realms/{name}/users(name=${realmName})}">← Users</a></p>
<h1><span th:text="${username}"></span> ABAC roles</h1>
<p th:if="${successMessage}" style="color:green" th:text="${successMessage}"></p>
<p th:if="${errorMessage}" style="color:red" th:text="${errorMessage}"></p>

<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Role</th><th>Valid from</th><th>Valid to</th><th>Attributes</th><th></th></tr>
    <tr th:each="a : ${assignments}">
        <td th:text="${a.role.name}"></td>
        <td th:text="${a.validFrom}"></td>
        <td th:text="${a.validTo != null ? a.validTo : 'no expiration'}"></td>
        <td th:text="${a.attributes}"></td>
        <td>
            <a th:href="@{/console/realms/{name}/users/{user}/roles/{id}/edit(name=${realmName},user=${username},id=${a.id})}">Edit</a>
            <form th:action="@{/console/realms/{name}/users/{user}/roles/{id}/delete(name=${realmName},user=${username},id=${a.id})}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" onclick="return confirm('Delete this assignment?')">Delete</button>
            </form>
        </td>
    </tr>
</table>

<h2>Assign role</h2>
<form th:action="@{/console/realms/{name}/users/{u}/roles(name=${realmName},u=${username})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label>Role
        <select name="roleId" required>
            <option th:each="r : ${availableRoles}" th:value="${r.id}" th:text="${r.name}"></option>
        </select>
    </label><br>
    <label>Valid from <input type="datetime-local" name="validFrom"></label><br>
    <label>Valid to (leave blank = no expiration) <input type="datetime-local" name="validTo"></label><br>
    <label>Attributes (JSON)<br>
        <textarea name="attributes" rows="4" cols="80"
                  placeholder='[{"key":"istatRegione","type":"string","value":"[1,2,3]","isArray":true}]'></textarea>
    </label><br>
    <button type="submit">Assign</button>
</form>
</body>
</html>
